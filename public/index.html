
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulfath Resolve | Complaint Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f1e8;
            color: #29251f;
        }

        nav {
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ded3c5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #a44832;
        }

        .hero {
            min-height: 75vh;
            padding: 90px 8%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .tag {
            color: #a44832;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        h1 {
            max-width: 750px;
            font-size: clamp(42px, 7vw, 78px);
            line-height: 1.08;
            margin-bottom: 24px;
        }

        h1 span {
            color: #a44832;
        }

        p {
            max-width: 570px;
            line-height: 1.8;
            color: #62594f;
            margin-bottom: 30px;
        }

        .cta {
            display: inline-block;
            background: #a44832;
            color: white;
            padding: 15px 24px;
            text-decoration: none;
            border-radius: 4px;
        }

        footer {
            padding: 24px 8%;
            border-top: 1px solid #ded3c5;
            color: #62594f;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Ulfath Resolve.</div>
        <span>Complaint Management Portal</span>
    </nav>

    <main class="hero">
        <div class="tag">A better way to be heard</div>

        <h1>
            Every concern deserves
            <span>a resolution.</span>
        </h1>

        <p>
            Submit complaints, track progress, and stay informed
            throughout the resolution process with Ulfath Resolve.
        </p>

        <a class="cta" href="/api/health">
            Check System Status →
        </a>
    </main>

    <footer>
        Ulfath Resolve · Complaint Management System
    </footer>
</body>
</html>
